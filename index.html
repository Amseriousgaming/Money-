<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c1626">
<title>AI Sentinel Public Alert</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--bg:#0c1626;--pn:#13233a;--tx:#e8eff9;--mu:#8fa3bf;--bd:#27405f;--ok:#2fd1a0;--wn:#ffb02e;--al:#ff5a5a;--ac:#38c6e8;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{height:100%;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
header{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#0a1220;border-bottom:1px solid var(--bd)}
header h1{font-size:17px;margin:0;flex:1}
.st{font-size:12.5px;color:var(--mu);display:flex;align-items:center;gap:6px}
.st i{width:9px;height:9px;border-radius:50%;background:var(--wn)}
.st.live i{background:var(--ok)}.st.off i{background:var(--al)}
#map{flex:1;min-height:0;background:#08111f}
.bar{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));background:#0a1220;border-top:1px solid var(--bd)}
button,select,input,textarea{font:inherit;color:inherit}
button{border:1px solid var(--bd);background:var(--pn);border-radius:12px;padding:12px 14px;min-height:46px;cursor:pointer}
button.sos{flex:1;background:var(--al);border-color:var(--al);color:#2b0606;font-weight:700;font-size:16px}
button.pri{background:var(--ac);border-color:var(--ac);color:#04202b;font-weight:600}
a.call{display:flex;align-items:center;border:1px solid var(--bd);background:var(--pn);border-radius:12px;padding:0 14px;color:var(--tx);text-decoration:none}
dialog{border:2px solid var(--al);border-radius:18px;background:var(--pn);color:var(--tx);width:calc(100vw - 20px);max-width:480px;padding:16px;max-height:calc(100dvh - 20px);overflow:auto}
dialog.ok{border-color:var(--ok)}
dialog::backdrop{background:rgba(3,8,16,.75)}
dialog h2{margin:0 0 8px;font-size:22px}
label{display:grid;gap:4px;margin:10px 0;color:var(--mu);font-size:13.5px}
select,input,textarea{width:100%;padding:11px;border-radius:10px;border:1px solid var(--bd);background:var(--bg)}
textarea{min-height:80px;resize:vertical}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.row button{flex:1}
.mu{color:var(--mu)}
.box{background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:9px 12px;margin:8px 0;font-size:14px}
.box b{display:block}
#toast{position:fixed;left:12px;right:12px;top:calc(64px + env(safe-area-inset-top,0px));z-index:999;background:var(--pn);border:1px solid var(--wn);border-left:5px solid var(--wn);border-radius:12px;padding:10px 14px;display:none}
.legend{position:absolute;z-index:500;left:10px;bottom:10px;background:rgba(10,18,32,.85);border:1px solid var(--bd);border-radius:10px;padding:6px 10px;font-size:12px;display:none}
@media(min-width:700px){.legend{display:block}}
</style>
</head>
<body>
<div id="app">
  <header><h1>🛡️ Public Alert</h1><div class="st" id="st"><i></i><span>Connecting…</span></div></header>
  <div id="toast" role="alert"></div>
  <div style="position:relative;flex:1;min-height:0;display:flex"><div id="map"></div>
    <div class="legend">🔴 Active danger &nbsp; 🟠 Warning &nbsp; ⚪ Your pending report &nbsp; 🔷 Sensor &nbsp; 🟣 Camera</div></div>
  <div class="bar">
    <button class="sos" id="sosBtn">🚨 Report emergency</button>
    <button id="locBtn" aria-label="My location">📍</button>
    <a class="call" id="callBtn" href="#">📞</a>
  </div>
</div>

<dialog id="dForm">
  <h2>Report an emergency</h2>
  <form id="f" method="dialog">
    <label>What is happening?
      <select id="type">
        <option>Fire</option><option>Flood / water level</option><option>Gas leak / smoke</option>
        <option>Earthquake damage</option><option>Accident</option><option>Medical emergency</option><option>Other danger</option>
      </select></label>
    <label>Describe it (what happens at this place)
      <textarea id="txt" maxlength="400" placeholder="Example: Smoke coming from the market building, people inside"></textarea></label>
    <div class="box"><b>Location</b><span id="locTxt" class="mu">Getting GPS…</span><br><span class="mu">Or tap the map to choose the place.</span></div>
    <div class="row"><button type="button" id="cancel">Cancel</button><button type="submit" class="pri" id="send">Send now</button></div>
  </form>
</dialog>

<dialog id="dSent" class="ok">
  <h2>✅ Emergency sent</h2>
  <p class="mu" id="sentSub"></p>
  <div id="sentInfo"></div>
  <div class="row"><button class="pri" id="sentOk">OK</button></div>
</dialog>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
/* ================= CONFIG: edit these ================= */
const DB_URL = "";            // Firebase Realtime DB url, e.g. "https://your-app-default-rtdb.firebaseio.com" (empty = demo mode, saves on this phone only)
const EMERGENCY_NUMBER = "112"; // number for the call button
const CENTER = [11.0168, 76.9558]; // default map center [lat,lng]
const POLL_MS = 4000;
// Your real sensors and cameras (id must match the ids your Command Center writes to /sensors/<id>)
const DEVICES = [
  {id:"mq2",  kind:"sensor", name:"MQ-2 Gas Sensor",   lat:11.0170, lng:76.9560},
  {id:"mq7",  kind:"sensor", name:"MQ-7 CO Sensor",    lat:11.0165, lng:76.9552},
  {id:"flame",kind:"sensor", name:"Flame Sensor",      lat:11.0172, lng:76.9549},
  {id:"water",kind:"sensor", name:"Water Level Sensor",lat:11.0160, lng:76.9566},
  {id:"cam1", kind:"camera", name:"Camera 1",          lat:11.0169, lng:76.9556}
];
/* ====================================================== */

const $ = id => document.getElementById(id);
const DEMO = !DB_URL;
const MINE = JSON.parse(localStorage.getItem("mine") || "[]");
let pick = null, gps = null, reports = {}, readings = {}, lastSend = 0, seenAlerts = new Set(), first = true;

const map = L.map("map",{zoomControl:true}).setView(CENTER,15);
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap"}).addTo(map);
const layer = L.layerGroup().addTo(map);
const pickMark = L.marker(CENTER,{opacity:0}).addTo(map);

function dist(a,b,c,d){const R=6371000,t=Math.PI/180,x=(c-a)*t,y=(d-b)*t,h=Math.sin(x/2)**2+Math.cos(a*t)*Math.cos(c*t)*Math.sin(y/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
const fmt = m => m<1000 ? Math.round(m)+" m" : (m/1000).toFixed(1)+" km";
function nearest(kind,lat,lng){
  return DEVICES.filter(d=>d.kind===kind).map(d=>({...d,d:dist(lat,lng,d.lat,d.lng)})).sort((a,b)=>a.d-b.d)[0] || null;
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function status(cls,txt){$("st").className="st "+cls;$("st").lastChild.textContent=txt}
function toast(msg){const t=$("toast");t.textContent=msg;t.style.display="block";clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display="none",6000);if(navigator.vibrate)navigator.vibrate([200,100,200])}

/* ---------- storage layer ---------- */
async function dbGet(path){
  if(DEMO){return JSON.parse(localStorage.getItem("demo:"+path)||"null")}
  const r = await fetch(DB_URL+"/"+path+".json"); if(!r.ok) throw 0; return r.json();
}
async function dbPush(path,obj){
  if(DEMO){const all=JSON.parse(localStorage.getItem("demo:"+path)||"{}");const k="r"+Date.now();all[k]=obj;localStorage.setItem("demo:"+path,JSON.stringify(all));return k}
  const r = await fetch(DB_URL+"/"+path+".json",{method:"POST",body:JSON.stringify(obj)}); if(!r.ok) throw 0; return (await r.json()).name;
}

/* ---------- map drawing ---------- */
function dot(lat,lng,color,html,r=10,fill=.8){return L.circleMarker([lat,lng],{radius:r,color,fillColor:color,fillOpacity:fill,weight:2}).bindPopup(html)}
function draw(){
  layer.clearLayers();
  DEVICES.forEach(d=>{
    const rd = readings[d.id], v = rd ? `<br>Reading: <b>${esc(rd.value ?? "–")}</b> (${esc(rd.level || "normal")})` : "";
    dot(d.lat,d.lng,d.kind==="camera"?"#a99bff":"#38c6e8",`<b>${esc(d.name)}</b>${v}`,7,.9).addTo(layer);
    if(rd && (rd.level==="alert"||rd.level==="warn")) L.circle([d.lat,d.lng],{radius:120,color:rd.level==="alert"?"#ff5a5a":"#ffb02e",weight:1,fillOpacity:.15}).addTo(layer);
  });
  Object.entries(reports).forEach(([id,r])=>{
    const mine = MINE.includes(id);
    if(r.status==="approved" && r.active!==false){
      const c = r.level===1 ? "#ffb02e" : "#ff5a5a";
      dot(r.lat,r.lng,c,`<b>${esc(r.type)}</b><br>${esc(r.text||"")}<br><span style="opacity:.7">${new Date(r.ts).toLocaleTimeString()}</span>`,13).addTo(layer);
      L.circle([r.lat,r.lng],{radius:150,color:c,weight:1,fillOpacity:.12}).addTo(layer);
    } else if(mine && r.status==="pending"){
      dot(r.lat,r.lng,"#cfd8e6",`<b>${esc(r.type)}</b><br>Your report – waiting for approval`,10,.5).addTo(layer);
    }
  });
}

/* ---------- polling ---------- */
async function poll(){
  try{
    const [rp,sn] = await Promise.all([dbGet("reports"),dbGet("sensors")]);
    reports = rp || {}; readings = sn || {};
    status(DEMO?"":"live", DEMO?"Demo mode (not connected)":"Live");
    Object.entries(reports).forEach(([id,r])=>{
      if(r.status==="approved" && r.active!==false && !seenAlerts.has(id)){
        seenAlerts.add(id);
        if(!first && !MINE.includes(id)) toast(`⚠️ ${r.type}: ${r.text||"danger reported"}`);
      }
      if(MINE.includes(id) && r.status!==seenAlerts["s"+id]){
        if(!first && r.status==="approved") toast("✅ Your report was approved and is now shown to everyone.");
        if(!first && r.status==="rejected") toast("Your report was reviewed and not published.");
        seenAlerts["s"+id]=r.status;
      }
    });
    first = false; draw();
  }catch(e){ status("off","Offline – retrying") }
}
setInterval(poll,POLL_MS); poll();

/* ---------- location ---------- */
function getGps(){
  $("locTxt").textContent="Getting GPS…";
  if(!navigator.geolocation){$("locTxt").textContent="GPS not available. Tap the map.";return}
  navigator.geolocation.getCurrentPosition(p=>{
    gps={lat:p.coords.latitude,lng:p.coords.longitude};
    if(!pick) showLoc(gps.lat,gps.lng,"GPS");
    map.setView([gps.lat,gps.lng],16);
  },()=>{if(!pick)$("locTxt").textContent="GPS blocked. Tap the map to choose the place."},{enableHighAccuracy:true,timeout:8000});
}
function showLoc(lat,lng,src){$("locTxt").textContent=`${lat.toFixed(5)}, ${lng.toFixed(5)} (${src})`}
map.on("click",e=>{
  pick={lat:e.latlng.lat,lng:e.latlng.lng};
  pickMark.setLatLng(e.latlng).setOpacity(1); showLoc(pick.lat,pick.lng,"chosen on map");
});
$("locBtn").onclick=getGps;
$("callBtn").href="tel:"+EMERGENCY_NUMBER;

/* ---------- submit ---------- */
$("sosBtn").onclick=()=>{ if(!$("dForm").open){ if(!pick) getGps(); $("dForm").showModal() } };
$("cancel").onclick=()=>$("dForm").close();
$("sentOk").onclick=()=>$("dSent").close();

$("f").addEventListener("submit",e=>{
  e.preventDefault();
  const loc = pick || gps;
  if(!loc){ $("locTxt").textContent="Location needed. Tap the map to choose the place."; return }
  if(Date.now()-lastSend < 30000){ toast("Please wait a few seconds before sending another report."); return }
  lastSend = Date.now();

  const ns = nearest("sensor",loc.lat,loc.lng), nc = nearest("camera",loc.lat,loc.lng);
  const rep = {type:$("type").value,text:$("txt").value.trim().slice(0,400),lat:loc.lat,lng:loc.lng,ts:Date.now(),
    status:"pending",active:true,nearSensor:ns&&ns.id,nearCamera:nc&&nc.id};

  /* popup first: shows instantly, network happens after */
  $("dForm").close();
  const rd = ns && readings[ns.id];
  $("sentSub").textContent = "Sending to the control center…";
  $("sentInfo").innerHTML =
    `<div class="box"><b>${esc(rep.type)}</b>${esc(rep.text||"No description")}</div>`+
    (ns?`<div class="box"><b>Nearest sensor: ${esc(ns.name)}</b>${fmt(ns.d)} away${rd?` · reading ${esc(rd.value??"–")} (${esc(rd.level||"normal")})`:""}</div>`:"")+
    (nc?`<div class="box"><b>Nearest camera: ${esc(nc.name)}</b>${fmt(nc.d)} away – operators will check it</div>`:"")+
    `<p class="mu">If someone is in danger, call <a style="color:var(--ac)" href="tel:${EMERGENCY_NUMBER}">${EMERGENCY_NUMBER}</a> now.</p>`;
  $("dSent").showModal();

  dbPush("reports",rep).then(id=>{
    MINE.push(id); localStorage.setItem("mine",JSON.stringify(MINE.slice(-50)));
    reports[id]=rep; draw();
    $("sentSub").textContent="Received. Waiting for an operator to approve it.";
    $("txt").value=""; pickMark.setOpacity(0); pick=null;
  }).catch(()=>{
    lastSend=0; $("sentSub").textContent="⚠️ Could not send. Check internet and try again, or call "+EMERGENCY_NUMBER+".";
  });
});
if("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
